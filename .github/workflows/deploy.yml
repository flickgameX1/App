name: Deploy to GitHub Pages

on:
  push:
    # The app currently lives on the feature branch; drop that line once it
    # merges and main carries it.
    branches:
      - main
      - claude/adhd-task-sprint-design-8zt8y1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        # Pages serves from /<repo>/, so the bundle and the manifest need that base.
        run: VITE_BASE="/${GITHUB_REPOSITORY#*/}/" npm run build
      - uses: actions/configure-pages@v5
        # Switches Pages on for the repo on the first run, so it does not have
        # to be found in the settings. This was refused while the repo was
        # private — Pages needs a paid plan there — and should go through once
        # the repo is public. If it is refused again, turn Pages on by hand
        # under Settings → Pages → Source: GitHub Actions.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
